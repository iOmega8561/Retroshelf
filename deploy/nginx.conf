# Nginx in front of Retroshelf (TLS certificates managed elsewhere, e.g. certbot).
server {
    listen 443 ssl;
    http2 on;
    server_name games.example.com;

    ssl_certificate     /etc/letsencrypt/live/games.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/games.example.com/privkey.pem;

    # Compress text; never re-compress ROMs (they are application/octet-stream or zip).
    gzip on;
    gzip_types application/json application/manifest+json text/css application/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Stream large ROMs straight through instead of spooling them to disk.
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 1h;

        # Do NOT add or override Cross-Origin-Opener-Policy / Cross-Origin-Embedder-Policy here:
        # the app already sends them, and duplicates make browsers drop isolation.
    }
}
